# Regénère automatiquement assets/site.css quand index.html change
name: Construire le style du site
on:
  push:
    branches: [main]
    paths: ['index.html', 'tailwind.config.js', 'assets/tailwind-input.css']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npx --yes tailwindcss@3.4.17 -c tailwind.config.js -i assets/tailwind-input.css -o assets/site.css --minify
      - name: Enregistrer le nouveau style s'il a changé
        run: |
          if ! git diff --quiet assets/site.css; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add assets/site.css
            git commit -m "Mise à jour automatique du style (site.css)"
            git push
          fi
